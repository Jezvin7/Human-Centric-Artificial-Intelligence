<!DOCTYPE html>
<html>

<head>

    <title>Supervised ML Interface</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        button{
            padding:10px 20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:8px;
        }

        th{
            background:#2563eb;
            color:white;
        }

        #resultBox{
            margin-top:20px;
            font-size:20px;
            color:green;
        }

    </style>

</head>

<body>

<h1>Supervised ML Interface</h1>

<!-- ================= UPLOAD ================= -->

<div class="card">

    <h2>Upload CSV</h2>

    <form id="uploadForm" enctype="multipart/form-data">

        {% csrf_token %}

        <input type="file" name="csv_file" required>

        <button type="submit">
            Upload
        </button>

        <button type="button" id="resetBtn">
            Reset
        </button>

    </form>

</div>


<!-- ================= DATA TABLE ================= -->

<div class="card">

    <h2>Data Preview</h2>

    <div id="tableArea"></div>

</div>


<!-- ================= SCATTER ================= -->

<div class="card">

    <h2>Scatter Plot</h2>

    <canvas id="scatterChart"></canvas>

</div>


<!-- ================= ML MODEL ================= -->

<div class="card">

    <h2>Train ML Model</h2>

    <select id="modelSelect">

        <option value="logistic_regression">
            Logistic Regression
        </option>

        <option value="decision_tree">
            Decision Tree
        </option>

        <option value="random_forest">
            Random Forest
        </option>

        <option value="knn">
            KNN
        </option>

    </select>

    <button id="runModelBtn">
        Run Model
    </button>

    <div id="resultBox"></div>

</div>


<script>

let scatterChart = null;


// ================= CSRF =================

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;
            }
        }
    }

    return cookieValue;
}


// ================= UPLOAD =================

document.getElementById("uploadForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const formData = new FormData(this);

    fetch("/project1/upload/", {

        method: "POST",

        headers: {
            "X-CSRFToken": getCookie("csrftoken")
        },

        body: formData

    })

    .then(response => response.json())

    .then(data => {

        console.log(data);

        if(!data.ok){

            alert(data.error);

            return;
        }

        // ================= TABLE =================

        let html = "<table>";

        html += "<tr>";

        data.columns.forEach(col => {

            html += `<th>${col}</th>`;

        });

        html += "</tr>";

        data.rows.forEach(row => {

            html += "<tr>";

            row.forEach(cell => {

                html += `<td>${cell}</td>`;

            });

            html += "</tr>";

        });

        html += "</table>";

        document.getElementById("tableArea").innerHTML = html;


        // ================= SCATTER =================

        const ctx =
            document.getElementById("scatterChart")
            .getContext("2d");

        if(scatterChart){

            scatterChart.destroy();
        }

        scatterChart = new Chart(ctx, {

            type: "scatter",

            data: {

                datasets: [{

                    label: "Scatter Plot",

                    data: data.scatter_data,

                    backgroundColor: "blue",

                    pointRadius: 5

                }]
            },

            options: {

                responsive: true,

                scales: {

                    x: {

                        title: {

                            display: true,

                            text: data.chart_x
                        }
                    },

                    y: {

                        title: {

                            display: true,

                            text: data.chart_y
                        }
                    }
                }
            }
        });

    });

});


// ================= RUN MODEL =================

document.getElementById("runModelBtn")
.addEventListener("click", function(){

    const model =
        document.getElementById("modelSelect").value;

    fetch("/project1/run_model/", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/x-www-form-urlencoded",

            "X-CSRFToken":
                getCookie("csrftoken")
        },

        body: "model=" + model

    })

    .then(response => response.json())

    .then(data => {

        console.log(data);

        if(!data.ok){

            document.getElementById("resultBox")
                .innerHTML = data.error;

            return;
        }

        // IMPORTANT FIX

        document.getElementById("resultBox")
            .innerHTML =

            "<h3>Result</h3>" +

            "<b>Model:</b> " +

            data.result.model +

            "<br><br>" +

            "<b>Accuracy:</b> " +

            data.result.accuracy + "%";

    });

});


// ================= RESET =================

document.getElementById("resetBtn")
.addEventListener("click", function(){

    location.reload();

});

</script>

</body>
</html>
